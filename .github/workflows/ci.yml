name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Check types
        run: pnpm check-types

      - name: Run unit and component tests
        run: pnpm test

      - name: Check geographic invariants
        run: pnpm geo:check

      - name: Build production assets
        run: pnpm build

  end-to-end:
    name: Critical journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Run Playwright journeys
        run: pnpm test:e2e

      - name: Retain Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-failure-evidence
          path: artifacts/playwright
          if-no-files-found: ignore
          retention-days: 7

  validate:
    name: validate
    if: always()
    needs: [quality, end-to-end]
    runs-on: ubuntu-latest
    steps:
      - name: Require every validation job
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          END_TO_END_RESULT: ${{ needs.end-to-end.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$END_TO_END_RESULT" = success
